<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de Pneus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Overlay da câmera (guia de alinhamento) */
        .camera-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 60%;
            border: 4px dashed rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 rounded-2xl shadow-lg max-w-sm w-full text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Scanner de Pneus</h1>
        <p class="text-gray-500 text-sm mb-6">Alinhe a banda de rodagem no guia e capture.</p>

        <div id="camera-container" class="relative w-full h-64 bg-black rounded-lg overflow-hidden mb-4 hidden">
            <video id="camera-stream" class="w-full h-full object-cover" autoplay playsinline></video>
            <div class="camera-overlay"></div>
        </div>

        <div id="action-buttons" class="flex flex-col gap-3 mb-4">
            <button id="btn-start-camera" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition">
                Abrir Câmera
            </button>
            <button id="btn-capture" class="hidden w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-4 rounded-lg transition">
                Capturar e Analisar
            </button>
        </div>

        <canvas id="canvas" class="hidden"></canvas>

        <!-- Estado de Loading com texto dinâmico -->
        <div id="loading-state" class="hidden flex flex-col items-center justify-center py-6">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-3"></div>
            <p id="loading-text" class="text-gray-600 font-medium">Analisando sulcos do pneu...</p>
        </div>

        <!-- Card de Resultado Atualizado (Sprint 4) -->
        <div id="result-card" class="hidden p-4 rounded-lg border-2 mt-4 transition-colors duration-300 text-left">
            <h2 id="result-title" class="text-xl font-bold mb-1 text-center"></h2>
            
            <!-- Barra de Vida Útil (Gauge) -->
            <div class="w-full bg-gray-200 rounded-full h-3 mb-2 mt-3">
                <div id="barra-vida" class="bg-green-500 h-3 rounded-full transition-all duration-1000" style="width: 0%"></div>
            </div>

            <p id="result-km" class="text-sm font-bold text-center mb-1"></p>
            <p id="result-confidence" class="text-xs font-medium text-center opacity-80 mb-3"></p>
            
            <!-- Recomendações Dinâmicas -->
            <div class="mt-3 bg-white bg-opacity-50 p-3 rounded-lg">
                <h3 class="text-sm font-bold border-b pb-1 mb-2">Recomendações:</h3>
                <ul id="dicas-lista" class="list-disc pl-5 text-xs"></ul>
            </div>

            <button onclick="location.reload()" class="mt-4 w-full bg-white hover:bg-gray-100 text-gray-800 border border-gray-300 font-semibold py-2 px-4 rounded-lg transition shadow-sm">
                Nova Análise
            </button>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera-stream');
        const cameraContainer = document.getElementById('camera-container');
        const btnStartCamera = document.getElementById('btn-start-camera');
        const btnCapture = document.getElementById('btn-capture');
        const canvas = document.getElementById('canvas');
        
        const loadingState = document.getElementById('loading-state');
        const loadingText = document.getElementById('loading-text');
        
        const resultCard = document.getElementById('result-card');
        const resultTitle = document.getElementById('result-title');
        const resultConfidence = document.getElementById('result-confidence');
        const resultKm = document.getElementById('result-km');
        const barraVida = document.getElementById('barra-vida');
        const dicasLista = document.getElementById('dicas-lista');

        // Mensagens dinâmicas para melhorar a percepção de valor
        const mensagensLoading = ["Verificando sulcos...", "Calculando desgaste...", "Acessando inteligência artificial...", "Gerando diagnóstico..."];
        let intervaloMensagens;

        // Inicializa a câmera
        btnStartCamera.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                cameraContainer.classList.remove('hidden');
                btnStartCamera.classList.add('hidden');
                btnCapture.classList.remove('hidden');
            } catch (err) {
                alert("Erro ao acessar a câmera: " + err.message);
            }
        });

        // Captura o frame e envia para a API
        btnCapture.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            cameraContainer.classList.add('hidden');
            btnCapture.classList.add('hidden');
            loadingState.classList.remove('hidden');

            video.srcObject.getTracks().forEach(track => track.stop());

            // Inicia o ciclo de mensagens de loading
            let msgIndex = 0;
            loadingText.innerText = mensagensLoading[0];
            intervaloMensagens = setInterval(() => {
                msgIndex++;
                loadingText.innerText = mensagensLoading[msgIndex % mensagensLoading.length];
            }, 1200);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('file', blob, 'pneu.jpg');

                try {
                    const response = await fetch('http://localhost:8000/predict', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    
                    clearInterval(intervaloMensagens);
                    showResult(data);
                } catch (error) {
                    console.error("Erro na API:", error);
                    clearInterval(intervaloMensagens);
                    
                    // Mock de fallback com a estrutura da Sprint 4 caso o backend caia
                    const mockData = {
                        status: "Careca",
                        confianca: "94.50%",
                        km_estimado: "0 km (Troca Imediata)",
                        dicas: ["Risco extremo de aquaplanagem.", "Substitua imediatamente."]
                    };
                    setTimeout(() => showResult(mockData), 500);
                }
            }, 'image/jpeg');
        });

        // Renderiza os dados no card de resultado
        function showResult(data) {
            loadingState.classList.add('hidden');
            resultCard.classList.remove('hidden');

            const statusLower = data.status.toLowerCase();
            
            // Textos básicos
            resultConfidence.innerText = `Confiança da IA: ${data.confianca}`;
            resultKm.innerText = `Estimativa: ${data.km_estimado || 'Indisponível'}`;

            // Renderiza as dicas dinâmicas
            dicasLista.innerHTML = '';
            if(data.dicas && data.dicas.length > 0) {
                data.dicas.forEach(dica => {
                    const li = document.createElement('li');
                    li.innerText = dica;
                    dicasLista.appendChild(li);
                });
            }

            // Aplica as cores e ajusta a barra de vida (Gauge)
            if (statusLower === 'bom') {
                resultCard.className = 'p-4 rounded-lg border-2 mt-4 bg-green-50 border-green-500 text-green-900 text-left';
                resultTitle.innerText = 'Pneu Seguro ✅';
                barraVida.className = 'bg-green-500 h-3 rounded-full transition-all duration-1000';
                setTimeout(() => barraVida.style.width = '100%', 100);
                
            } else if (statusLower === 'atencao' || statusLower === 'atenção') {
                resultCard.className = 'p-4 rounded-lg border-2 mt-4 bg-yellow-50 border-yellow-500 text-yellow-900 text-left';
                resultTitle.innerText = 'Desgaste Moderado ⚠️';
                barraVida.className = 'bg-yellow-500 h-3 rounded-full transition-all duration-1000';
                setTimeout(() => barraVida.style.width = '50%', 100);

            } else {
                resultCard.className = 'p-4 rounded-lg border-2 mt-4 bg-red-50 border-red-500 text-red-900 text-left';
                resultTitle.innerText = 'Troca Imediata ❌';
                barraVida.className = 'bg-red-600 h-3 rounded-full transition-all duration-1000';
                setTimeout(() => barraVida.style.width = '10%', 100);
            }
        }
    </script>
</body>
</html>
